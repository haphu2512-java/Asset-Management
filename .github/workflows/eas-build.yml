name: EAS Build & CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Changes that don't affect the app (docs, Supabase functions/migrations) don't trigger a build.
    paths-ignore:
      - '**.md'
      - 'supabase/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview: APK, production: AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - all

jobs:
  test_and_typecheck:
    name: Run Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
        env:
          NODE_OPTIONS: "--experimental-strip-types"

  build:
    name: EAS Cloud Build
    needs: test_and_typecheck
    # Every push to main (and every v* tag) builds an APK; pull requests only run the checks above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build with EAS
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          eas build --platform $PLATFORM --profile $PROFILE --non-interactive --no-wait
