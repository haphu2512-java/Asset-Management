name: Deploy Supabase

# Applies new migrations and redeploys the Edge Functions when they change on main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project id in the dashboard URL
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
# Without them the workflow skips itself, and everything can still be done by hand (docs/SETUP.md).

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      migrations:
        description: 'Apply database migrations'
        type: boolean
        default: true
      functions:
        description: 'Deploy Edge Functions'
        type: boolean
        default: true

# Never run two deployments against the same database at once, and never cancel one half-way.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations & Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets are not set, skipping the deployment. See docs/SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        if: steps.secrets.outputs.ready == 'true' && (github.event_name == 'push' || inputs.migrations)
        run: supabase migration list

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true' && (github.event_name == 'push' || inputs.migrations)
        run: supabase db push

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true' && (github.event_name == 'push' || inputs.functions)
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
